<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:-apple-system,"PingFang SC",sans-serif;color:#222;padding:18px;width:1290px}
h2{font-size:15px;margin:10px 0 4px} p{font-size:12.5px;margin:0 0 6px;color:#444;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap} canvas{border:1px solid #ccc;display:block} .cap{font-size:12px;color:#555;width:310px;line-height:1.45;margin-top:3px}
.lg span{display:inline-block;margin-right:16px;font-size:12.5px} .dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px;vertical-align:-1px}
pre{font-size:12px;background:#f6f6f6;padding:8px;white-space:pre-wrap}
</style></head><body>
<h2>区间的一个端点，用三种量来记位置：线变形后它们落在哪里</h2>
<p>标记：蓝圈 = ③、绿点 = ②、红小点 = ①，重合时套在一起。一笔 = 曲线 A（深色，两段贝塞尔：A1、A2，中间锚点 m）+ 曲线 B（浅色）。原图里三种记法都指向同一点：A2 段里的某处。之后分别做三种变形，看三个点去了哪里。</p>
<div class="lg"><span><i class="dot" style="background:#e03131"></i>① 整笔弧长比例（整笔总长的百分之几）</span><span><i class="dot" style="background:#2f9e44"></i>② 本曲线弧长比例（曲线 A 自己总长的百分之几）</span><span><i class="dot" style="border:2px solid #1971c2;width:8px;height:8px"></i>③ 原贝塞尔段参数（A2 段的参数 u，跟着这一段的锚点和手柄走）</span></div>
<div class="row" id="r"></div><pre id="out"></pre>
<script>
const S=1.7
// cubic segments: [p0,c1,c2,p3]
const base={A1:[[10,90],[30,40],[60,40],[80,70]],A2:[[80,70],[95,92],[105,92],[118,70]],B:[[118,70],[130,50],[140,50],[150,60]]}
const clone=o=>JSON.parse(JSON.stringify(o))
const bez=(q,t)=>{const u=1-t;return [0,1].map(k=>u*u*u*q[0][k]+3*u*u*t*q[1][k]+3*u*t*t*q[2][k]+t*t*t*q[3][k])}
function table(q,n=400){const pts=[],len=[0];for(let i=0;i<=n;i++){pts.push(bez(q,i/n));if(i)len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}return {pts,len,total:len[n]}}
function atLen(segs,L){ // segs: array of cubic; L arc length from start
  for(const q of segs){const t=table(q);if(L<=t.total){for(let i=1;i<t.len.length;i++)if(t.len[i]>=L){const f=(L-t.len[i-1])/(t.len[i]-t.len[i-1]||1);return [t.pts[i-1][0]+(t.pts[i][0]-t.pts[i-1][0])*f,t.pts[i-1][1]+(t.pts[i][1]-t.pts[i-1][1])*f]}}L-=t.total}
  const q=segs.at(-1);return q[3]}
const lenOf=segs=>segs.reduce((a,q)=>a+table(q).total,0)
// define the original point: A2 at parameter u0
const u0=0.5
const P0=bez(base.A2,u0)
const tA2=table(base.A2); const lenA2u0=tA2.len[Math.round(u0*400)]
const L1=table(base.A1).total
const fracStroke=(L1+lenA2u0)/lenOf([base.A1,base.A2,base.B])
const fracCurve=(L1+lenA2u0)/lenOf([base.A1,base.A2])
function marks(g){return {
  red:atLen([g.A1,g.A2,g.B],fracStroke*lenOf([g.A1,g.A2,g.B])),
  green:atLen([g.A1,g.A2],fracCurve*lenOf([g.A1,g.A2])),
  blue:bez(g.A2,u0)}}
const states=[]
states.push(['原图：三种记法都在同一点',clone(base)])
{const g=clone(base);g.B=[[118,70],[135,40],[160,30],[178,60]];states.push(['变形 1：只把曲线 B 拉长（A 没动）',g])}
{const g=clone(base);g.A1=[[10,90],[15,10],[60,10],[80,70]];states.push(['变形 2：只改 A1 段（把它拉高变长），A2 段没动',g])}
{const g=clone(base);g.A2=[[80,70],[82,110],[100,96],[118,70]];states.push(['变形 3：只拉 A2 段自己的手柄',g])}
const out=[`原始：① 整笔比例 ${fracStroke.toFixed(3)}；② 曲线 A 比例 ${fracCurve.toFixed(3)}；③ A2 段参数 u = ${u0}`]
const pth=q=>{const p=new Path2D();p.moveTo(...q[0]);p.bezierCurveTo(...q[1],...q[2],...q[3]);return p}
for(const [cap,g] of states){
  const cv=document.createElement('canvas');cv.width=310;cv.height=210;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,310,210);c.setTransform(S,0,0,S,-6,-6)
  c.lineWidth=2;c.lineCap='round';c.strokeStyle='#3b2a20';c.stroke(pth(g.A1));c.stroke(pth(g.A2));c.strokeStyle='#b8a99a';c.stroke(pth(g.B))
  c.fillStyle='#3b2a20';for(const p of [g.A1[0],g.A1[3],g.A2[3]]){c.beginPath();c.arc(...p,1.6,0,7);c.fill()}
  c.font='5px sans-serif';c.fillStyle='#666';c.fillText('A1',g.A1[0][0]+4,g.A1[0][1]-4);c.fillText('m',g.A1[3][0]-6,g.A1[3][1]-3);c.fillText('B',g.B[3][0]-2,g.B[3][1]-4)
  const m=marks(g);const off={red:[-3,0],green:[0,0],blue:[3,0]};const col={red:'#e03131',green:'#2f9e44',blue:'#1971c2'}
  c.lineWidth=1.1;c.strokeStyle=col.blue;c.beginPath();c.arc(...m.blue,3.6,0,7);c.stroke();c.fillStyle=col.green;c.beginPath();c.arc(...m.green,2.3,0,7);c.fill();c.fillStyle=col.red;c.beginPath();c.arc(...m.red,1.3,0,7);c.fill()
  const d=document.createElement('div');d.appendChild(cv);const t=document.createElement('div');t.className='cap';t.textContent=cap;d.appendChild(t);document.getElementById('r').appendChild(d)
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]).toFixed(1)
  out.push(`${cap}：①→③ 距离 ${dist(m.red,m.blue)}，②→③ 距离 ${dist(m.green,m.blue)}（图上单位）`)
}
document.getElementById('out').textContent=out.join('\n');document.title='ready'
</script></body></html>
