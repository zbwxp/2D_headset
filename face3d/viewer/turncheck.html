<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>转头检视</title>
<style>body{margin:0;font:14px system-ui;background:#fafaf8}#bar{padding:8px 12px;display:flex;gap:12px;align-items:center}canvas{display:block;margin:0 auto;background:#fff;border:1px solid #ddd}</style></head>
<body><div id="bar">转头 <input id="yaw" type="range" min="0" max="90" step="1" value="0" style="width:360px"> <b id="yv">0°</b> <select id="var"></select>
<button data-k="0">0°</button><button data-k="45">45°</button><button data-k="90">90°</button><label><input id="marks" type="checkbox" checked> 端点</label> <label><input id="ref" type="checkbox" checked> 参考图（取消 = 只看轮廓）</label><span id="info" style="color:#555"></span></div>
<div style="padding:0 12px;color:#a33">中间角度只有轮廓插值；参考图淡入淡出只是对照，不代表五官的连续运动。</div><canvas id="c" width="760" height="760"></canvas><script type="module" src="./turncheck.ts"></script></body></html>
