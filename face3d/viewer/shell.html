<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>头壳展示间</title>
<style>
  body { margin: 0; font: 14px/1.5 "PingFang SC", sans-serif; background: #f6f6f4; color: #222; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { background: #f6f6f4; border: 1px solid #ddd; border-radius: 8px; width: min(80vh, 92vw); height: min(80vh, 92vw); cursor: grab; touch-action: none; }
  .side { width: 260px; } label { display: block; margin: 6px 0; } input[type=range] { width: 100%; } #status { color: #777; font-size: 12px; }
</style>
</head>
<body>
  <canvas id="c" width="900" height="900"></canvas>
  <div class="side">
    <h3 style="margin:0 0 8px">头壳展示间 · test.vrm</h3>
    <div>yaw：<span id="yv"></span></div><input type="range" id="yaw" min="-180" max="180" value="30">
    <div>pitch（+ = 仰视）：<span id="pv"></span></div><input type="range" id="pitch" min="-80" max="80" value="0">
    <label><input type="checkbox" id="contour" checked>网格轮廓预览（黑）</label>
    <p style="font-size:12px;color:#555">拖动画面转头，滚轮缩放。皮肤在脖子处切开；黑线 = 网格轮廓预览：皮肤上一侧朝前、一侧朝后的边，按边中点判断遮挡，不是精确的可见轮廓。五官是 VRoid 自带的贴片，只按颜色显示；画时往前偏了一点深度，五官遮挡不作准。这是基础网格的简化预览，不是 VRoid 导出效果的完整还原。</p>
    <div id="status"></div>
  </div>
  <script type="module" src="./shell.ts"></script>
</body>
</html>
