<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>捏脸反推</title>
<style>body{margin:0;font:13px system-ui;background:#fafaf8;display:flex;flex-direction:column;height:100vh}.bar{padding:5px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #e4e4e0}
#wrap{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;background:#fff;cursor:grab;touch-action:none}
.cap{position:absolute;top:6px;font-size:13px;color:#333;background:rgba(255,255,255,.8);padding:1px 4px}</style></head>
<body>
<div class="bar"><b id="view">转 0°</b> 拖动 = 两个头一起转 / 俯仰，滚轮缩放
<button data-v="0,0">正面</button><button data-v="30,0">30°</button><button data-v="45,0">45°</button><button data-v="60,0">60°</button><button data-v="90,0">侧面</button><button data-v="180,0">背面</button><button data-v="0,-80">从上往下</button><button data-v="0,60">从下往上</button>
<label><input id="target" type="checkbox" checked> 之前模型的脸外轮廓（红，只在 0°～90° 转头、不俯仰时）</label>
<label><input id="ghost" type="checkbox"> 右边叠上原来的 VRoid 轮廓（灰）</label></div>
<div class="bar" style="color:#666">左：原来的 VRoid 头（耳朵压平、去掉脖子）　右：捏过的副本：每个转头角度（0°～90° 每 10°）的外轮廓都往之前模型的脸外轮廓（外侧 3 条 + 下颌，近正面时内侧颅骨线）上拉，拉动平滑扩散到全头，左右对称。后脑勺不在之前的模型里，没有目标。</div>
<div id="wrap"><canvas id="c"></canvas><div class="cap" style="left:8px">原来的 VRoid</div><div class="cap" style="left:50%">捏过的副本</div></div>
<script type="module" src="./sculpt.ts"></script></body></html>
