<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>极简头线框</title>
<style>body{margin:0;font:14px system-ui;background:#fafaf8}.bar{padding:6px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}canvas{display:block;margin:0 auto;background:#fff;border:1px solid #ddd;cursor:grab;touch-action:none}#wrap{position:relative;width:1400px;margin:0 auto}#labels{position:absolute;left:0;top:0;pointer-events:none}#labels div{position:absolute;font-size:12px;color:#111;background:rgba(255,255,255,.75);padding:0 2px;white-space:nowrap}</style></head>
<body>
<div class="bar"><b id="view">转 0° · 俯仰 0°</b> 拖动画布转头 / 俯仰，滚轮缩放
<button data-v="0,0">正面</button><button data-v="45,0">45°</button><button data-v="90,0">侧面</button><button data-v="0,60">从下往上</button><button data-v="0,-80">从上往下</button><button data-v="35,20">斜上</button>
<label><input id="onHead" type="checkbox" checked> 线框也画在左边头上</label> <label><input id="raw" type="checkbox"> 原始截线（灰）</label> <label><input id="joints" type="checkbox" checked> 接点</label> <label><input id="cl" type="checkbox"> 交点蔟（参考）</label></div>
<div class="bar" id="status" style="color:#555"></div>
<div class="bar" style="color:#555">左：VRoid 头（带脖子）　右：极简线框 = 经线（红，对称面截线，9 条贝塞尔）+ 纬线（橘，额头那一圈 = 从正上方看的外轮廓，2 条贝塞尔）+ 耳朵（绿，每边 3 条：上耳根 → 耳尖 → 耳垂 → 下耳根，不闭合）+ 眼眶（紫，皮肤在眼睛处开口的边，每边 3 条：上眼睑、下眼睑两段）</div>
<div id="wrap"><canvas id="c" width="1400" height="700"></canvas><div id="labels"></div></div>
<script type="module" src="./vrmwire.ts"></script></body></html>
