<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对称脸轮廓</title>
<style>
  body { margin: 0; font: 14px/1.5 "PingFang SC", sans-serif; background: #f6f6f4; color: #222; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { background: #fafaf8; border: 1px solid #ddd; border-radius: 8px; width: min(80vh, 92vw); height: min(80vh, 92vw); cursor: grab; touch-action: none; }
  .side { width: 280px; } label { display: block; margin: 6px 0; } input[type=range] { width: 100%; }
</style>
</head>
<body>
  <canvas id="c" width="1000" height="1000"></canvas>
  <div class="side">
    <h3 style="margin:0 0 8px">对称脸轮廓（只在 2D 平面里）</h3>
    <div>yaw：<span id="yv"></span></div><input type="range" id="yaw" min="-90" max="90" value="30">
    <div>pitch：<span id="pv"></span></div><input type="range" id="pitch" min="-45" max="45" value="0">
    <label><input type="checkbox" id="orig" checked>显示原轮廓（红）和镜像过来的一侧（蓝虚线）</label>
    <p style="font-size:12px;color:#555">来源：桌面 123.json 的「脸轮廓」图层（只读提取）。任一角度：用 bench 自己的插值（9 个视角 + 你在 30/60 的回放修正）算出轮廓；再把 −yaw 那一侧的轮廓左右镜像（左颅↔右颅、左下颌↔右下颌），两者逐个控制点取平均 = 黑色粗线。下面一排是同一俯仰下 yaw −90…90 的对称轮廓。拖动画面或滑块检视。</p>
  </div>
  <script type="module" src="./outline2d.ts"></script>
</body>
</html>
