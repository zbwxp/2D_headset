<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>模型表面轮廓</title>
<style>body{margin:0;font:13px system-ui;background:#fafaf8;display:flex;flex-direction:column;height:100vh}.bar{padding:5px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #e4e4e0}
canvas{flex:1;min-height:0;width:100%;background:#fff;cursor:grab;touch-action:none}</style></head>
<body>
<div class="bar"><b id="view"></b> 拖动 = 转头 / 俯仰
<button data-v="0,0">正面</button><button data-v="30,0">30°</button><button data-v="63,0">63°</button><button data-v="90,0">侧面</button><button data-v="45,-60">转45 俯60</button><button data-v="70,40">转70 仰40</button><button data-v="30,-85">转30 俯85</button>
<label><input id="sLine" type="checkbox" checked> <span style="color:#1a9a3a">■</span> 从模型表面算的轮廓（看得见的部分）</label>
<label><input id="sHid" type="checkbox"> <span style="color:#9bd">■</span> 被挡住的部分</label>
<label><input id="sPix" type="checkbox"> <span style="color:#000">■</span> 之前的像素描边</label>
<label><input id="sImg" type="checkbox" checked> 头的图</label>
法线平滑 <select id="smooth"><option>0</option><option selected>2</option><option>4</option><option>8</option></select>
<button id="sweep">扫一遍：转 0→90</button></div>
<div class="bar" style="color:#666">绿线不是在图上描的：每个顶点算「它的法线朝不朝向眼睛」，轮廓就是正好侧着的那条线，在三角形边上按比例插值找出来连成线（头上的一条 3D 线），再按深度去掉被挡住的。外轮廓、下巴底下、鼻翼侧面这些「转过去的地方」都会出来。</div>
<canvas id="c"></canvas>
<script type="module" src="./smoothcontour.ts"></script></body></html>
