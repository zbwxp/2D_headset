<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>头壳标注</title>
<style>
body{margin:0;font:13px system-ui;background:#fafaf8;display:flex;height:100vh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{padding:5px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid #e4e4e0}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;background:#fff;cursor:grab;touch-action:none}
#labels{position:absolute;left:0;top:0;pointer-events:none}
#labels div{position:absolute;font-size:12px;color:#111;background:rgba(255,255,255,.75);padding:0 2px;white-space:nowrap}
#labels div.back{opacity:.35}
#side{width:300px;border-left:1px solid #ddd;overflow:auto;padding:8px;box-sizing:border-box;background:#fff}
#side h3{margin:8px 0 4px;font-size:13px}
.row{display:flex;gap:4px;align-items:center;padding:2px 3px;border-radius:3px}
.row.sel{background:#e3efff}
.row input{flex:1;min-width:0;font:inherit;padding:1px 3px}
.row span{color:#777;font-size:11px;white-space:nowrap}
.row button{padding:0 5px}
#help{color:#555;font-size:12px;line-height:1.5}
</style></head>
<body>
<div id="main">
<div class="bar"><b id="view">转 0° · 俯仰 0°</b>
<button data-v="0,0">正面</button><button data-v="45,0">45°</button><button data-v="90,0">侧面</button><button data-v="-90,0">另一侧</button><button data-v="180,0">背面</button><button data-v="0,60">从下往上</button><button data-v="0,-80">从上往下</button><button id="home">缩放复位</button>
<button id="link">连线（选两个点）</button><button id="import">载入现有线框</button><button id="undo">撤销</button>
<label><input id="xray" type="checkbox"> 透过头看背面的点线</label>
<label><input id="wire" type="checkbox"> 参考线框</label><label><input id="lnames" type="checkbox"> 线的名字（不勾只显示选中的那条）</label>
<button id="save">保存文件</button><label><button id="openBtn">打开文件</button><input id="open" type="file" accept=".json" hidden></label></div>
<div id="wrap"><canvas id="c"></canvas><div id="labels"></div></div>
</div>
<div id="side">
<div id="help">拖动 = 转头，滚轮 = 缩放（对着鼠标）<br>按 Z = 放大镜：往上拖放大、往下拖缩小，再按 Z 回来<br>按住空格拖 = 平移<br>双击头壳 = 加点；拖点 = 点贴着头壳滑<br>点一个点，再按住 Shift 点另一个 →「连线」<br>双击点 = 改名字；选中点或线后按 Enter 也行（列表里也能改）<br>点一条线 = 显示它的两个手柄（橙），拖手柄改弯度<br>左 / 右 = 正面看画面的左 / 右<br>Delete = 删除选中的；Ctrl/⌘+Z = 撤销<br>自动存在浏览器里</div>
<h3>点</h3><div id="points"></div>
<h3>线</h3><div id="lines"></div>
<div id="status" style="color:#777;font-size:11px;margin-top:8px"></div>
</div>
<script type="module" src="./shelledit.ts"></script></body></html>
